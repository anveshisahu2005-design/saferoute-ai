<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRoute AI</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <span class="shield">🛡️</span> SafeRoute AI
            </div>
            <div class="tagline">
                Prioritizing your safety over speed.
            </div>

            <div class="search-container">
                <div class="input-group">
                    <label>Origin</label>
                    <input type="text" id="origin" placeholder="Enter starting point..." />
                </div>
                <div class="input-group">
                    <label>Destination</label>
                    <input type="text" id="destination" placeholder="Enter destination..." />
                </div>
                <button class="route-btn" id="findRouteBtn">Find Safe Route</button>
            </div>
            
            <div id="predictionResult" style="display: none; margin-top: 2rem; padding: 1.2rem; border-radius: 10px; background: rgba(0,0,0,0.6); border: 1px solid #222;">
                <h3 style="margin:0 0 0.5rem 0; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.1em; color:#888;">AI Safety Prediction</h3>
                <div id="safetyScore" style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; color: #fff;"></div>
                <p id="safetyDetails" style="margin:0; font-size: 0.85rem; color:#aaa; line-height: 1.4;"></p>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Heat JS -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- App JS -->
    <script src="app.js"></script>
</body>
</html>
